# Gourmand exceptions. Each entry is a finding reviewed by hand and kept on
# purpose; the justification says why.

[[exceptions]]
check = "CH009-random_scripts"
path = "rootfs/usr/local/libexec/josui/hooks.py"
justification = "rootfs/ is the image's filesystem overlay (COPY rootfs/ / in the Containerfile), so a file's path here is its install path. hooks.py is the hook Claude Code's managed settings run on every tool call, installed under libexec because nothing calls it by hand. It is documented in README.md and covered by tests/test_hooks.py."
classification = "by_design"

[[exceptions]]
check = "CH001-absolute_paths"
path = "rootfs/etc/claude-code/managed-settings.json"
justification = "A hook command in Claude Code managed settings is run by a shell with no defined working directory, so it has to name the hook by its absolute install path inside the image."
classification = "by_design"

[[exceptions]]
check = "CH001-absolute_paths"
path = "deploy/josui.env.example"
justification = "An example env file for a container deployment. The values are the host paths of bind mounts, which podman requires to be absolute; they use placeholder service names."
classification = "by_design"

[[exceptions]]
check = "EV013-hidden_env_config"
path = "rootfs/usr/local/libexec/josui/hooks.py"
justification = "JOSUI_AUDIT_DIR and JOSUI_BREAKER_DIR are not toggles: they are the required locations the hooks write to, set by ENV in the Containerfile, listed in README.md's Environment table and in the module docstring. A hook receives no arguments from Claude Code beyond its command line, so the environment is the only channel, and reading them with no default makes a missing one fail loudly."
classification = "by_design"

[[exceptions]]
check = "CH009-random_scripts"
path = "rootfs/usr/local/libexec/josui/allow-hook.sh"
justification = "Installed by COPY rootfs/ / as a PreToolUse hook that managed settings run on every tool call (the prompts-off hook, opt-in with JOSUI_ANSWER_PERMISSIONS=1). Documented in README.md and the constitution's human-in-the-loop rule; covered by tests/test_shell_hooks.py."
classification = "by_design"

[[exceptions]]
check = "CH009-random_scripts"
path = "rootfs/usr/local/libexec/josui/deny-local-memory.sh"
justification = "Installed by COPY rootfs/ / as a PreToolUse hook that managed settings run on writes and shell commands, keeping Claude Code's file-based memory empty. Documented in README.md; covered by tests/test_shell_hooks.py."
classification = "by_design"

[[exceptions]]
check = "CH009-random_scripts"
path = "rootfs/usr/local/libexec/josui/matrix-channel.py"
justification = "Installed by COPY rootfs/ / as the Matrix channel, a stdio MCP server that Claude Code starts and that managed settings admit by this exact path. Documented in README.md; covered by tests/test_matrix_channel.py."
classification = "by_design"

[[exceptions]]
check = "EV003-test_skip_evasion"
path = "tests/test_channel_session.py"
justification = "These tests drive channel-session with expect. CI installs expect before the test step (build.yml), so they always run there; the skip only spares a workstation that lacks it."
classification = "by_design"
