name: Build and Push Josui

# Triggers (deliberately NO `schedule:`):
#   push   - image, hook, test or workflow changes, or a vX.Y.Z tag
#            (constitution II: tags trigger release workflows)
#   workflow_dispatch - manual rebuild
#   repository_dispatch parent-image-updated - the fleet's weekly pulse, so
#     the image is rebuilt for CVE pickup without a cron of its own.
#
# Profile alignment (autonomous-agent III): the hook tests run first, then
# Trivy (blocking on CRITICAL/HIGH, with .trivyignore), an SPDX SBOM, and a
# push to Quay and GHCR as two jobs so one registry's trouble does not hold
# the other. cosign signing is not wired yet; see the constitution, Layer 3.

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'Containerfile'
      - 'rootfs/**'
      - 'tests/**'
      - '.trivyignore'
      - '.github/workflows/build.yml'
  pull_request:
    branches: [main]
  repository_dispatch:
    types: [parent-image-updated]
  workflow_dispatch:

env:
  QUAY_IMAGE: quay.io/crunchtools/josui
  GHCR_IMAGE: ghcr.io/crunchtools/josui

jobs:
  test-hooks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install expect
        run: sudo apt-get update -qq && sudo apt-get install -y -qq expect

      - name: Hook and entrypoint tests
        run: python3 -m unittest discover -s tests -v

  build-and-push-quay:
    runs-on: ubuntu-latest
    needs: test-hooks
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      sha_short: ${{ steps.version.outputs.sha_short }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Get version tag
        id: version
        run: |
          TAG=$(git describe --tags --always 2>/dev/null || echo "v0.1.0")
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # load: true puts the image in the local daemon so the scans below can
      # read it directly.
      - name: Build image for scanning
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Containerfile
          load: true
          tags: josui:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Full-severity inventory, report-only. This is the artifact humans read
      # when deciding what to accept; the gate below is what blocks the build.
      - name: Trivy full CVE report (all severities, non-blocking)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: josui:scan
          format: "table"
          exit-code: "0"
          severity: "UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL"
          scanners: "vuln"

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: josui:scan
          format: "table"
          exit-code: "1"
          severity: "CRITICAL,HIGH"
          trivyignores: ".trivyignore"

      - name: Generate SBOM (Trivy / SPDX-JSON)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: josui:scan
          format: "spdx-json"
          output: "josui-sbom.spdx.json"
          exit-code: "0"

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v7
        with:
          name: josui-sbom-${{ steps.version.outputs.sha_short }}
          path: josui-sbom.spdx.json
          retention-days: 90

      - name: Log in to Quay.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}

      # Cache hit, not a rebuild -- this is what cache-to: mode=max above buys.
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Containerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.QUAY_IMAGE }}:latest
            ${{ env.QUAY_IMAGE }}:${{ steps.version.outputs.tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.description=Josui - Claude Code packaged as a crunchtools autonomous agent
            org.opencontainers.image.licenses=AGPL-3.0-or-later
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-and-push-ghcr:
    runs-on: ubuntu-latest
    needs: build-and-push-quay
    if: github.event_name != 'pull_request'
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ github.token }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Containerfile
          push: true
          tags: |
            ${{ env.GHCR_IMAGE }}:latest
            ${{ env.GHCR_IMAGE }}:${{ needs.build-and-push-quay.outputs.tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.description=Josui - Claude Code packaged as a crunchtools autonomous agent
            org.opencontainers.image.licenses=AGPL-3.0-or-later
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
