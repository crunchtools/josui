# Dependabot config for crunchtools/josui (Host Tool profile).
# See constitution.md Section XV.
#
# This repo builds no image (the runtime is quay.io/crunchtools/developer), so
# what goes stale silently is the lockfile of the gates' own tools (uv) and the
# `uses:` action pins.

version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "crunchtools/constitution*"
