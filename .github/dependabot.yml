# Dependabot config for crunchtools container-only repos.
# See constitution.md Section XV.
#
# This repo ships a Containerfile and workflows, with no language-level
# manifest, so the two things that go stale silently are the base image
# pin and the `uses:` action pins. CLAUDE_CODE_VERSION and GH_VERSION in the
# Containerfile are bumped by hand: a new Claude Code is tested before Josui
# runs on it.

version: 2
updates:
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "crunchtools/constitution*"
