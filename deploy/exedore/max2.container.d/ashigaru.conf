# Ashigaru Desk seat key (a242): podman secret ashigaru-max2, mounted on the
# container tmpfs for the seat user. The CLI reads the env below.
[Container]
Secret=ashigaru-max2,type=mount,uid=1000,gid=1000,mode=0600,target=/run/secrets/ashigaru.key
Environment=ASHIGARU_URL=https://ashigaru.crunchtools.com
Environment=ASHIGARU_API_KEY_FILE=/run/secrets/ashigaru.key
