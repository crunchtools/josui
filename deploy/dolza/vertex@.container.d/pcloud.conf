[Container]
# Scott's pCloud drive, live and read-only (see pcloud-seats.service), at the
# SAME paths as on the host: /home/smccarty/pCloudDrive, plus the Downloads
# and Pictures/Screenshots symlinks into it. Dragging a file into the terminal
# pastes its host path, and the seat must open exactly that path. rslave: a
# bindfs restart reaches the running seat. No :z, FUSE cannot be relabelled.
Volume=%h/.pcloud-seats:/home/smccarty:ro,rslave
