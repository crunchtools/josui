# The Vertex seats' gatehouse.env (a813): Gatehouse's own gateway token, not
# the seat's. What that buys, and what it does not:
#
# - The seat's own token (profile dolza-vertex) no longer reaches OpenRouter.
# - This token (profile dolza-gatehouse) has no tools, no git route and no
#   /proxy/llm route. Its one way out is POST
#   /proxy/http/openrouter-gatehouse/api/v1/chat/completions, under block, with
#   a semantic request guard whose policy refuses Red Hat content.
# - It is NOT scoped to Gatehouse. It is a file every process on the seat can
#   read, so anything there can call that route; the gateway's guard, not the
#   token, is what is meant to keep Red Hat content off OpenRouter. The
#   python-sdlc remote check is a client-side guard against accidents.
#
# OpenBao kv dolza/gatehouse-vertex/gatehouse.env, delivered to tmpfs by
# srv-secrets@gatehouse-vertex. A gatehouse.env under $JOSUI_CONFIG_DIR/mcp-env
# wins over the one developer-entrypoint would write from the seat token. The
# mountpoint is developer-identity/mcp-env, an empty directory on the host.
[Unit]
Requires=srv-secrets@gatehouse-vertex.service
After=srv-secrets@gatehouse-vertex.service

[Container]
Volume=%t/srv-secrets/gatehouse-vertex/gatehouse.env:/etc/josui/mcp-env/gatehouse.env:ro
